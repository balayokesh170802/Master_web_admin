<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QA CRUD Test Runner</title>
  <link rel="stylesheet" href="./src/styles/typography.css">
  <link rel="stylesheet" href="./src/styles/theme.css">
  <link rel="stylesheet" href="./src/styles/main.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div id="app"></div>
  <script src="./src/App.js?v=v89"></script>
  <script>
    window.testResults = [];

    function recordTest(suite, testName, passed, details = '', severity = 'Normal') {
      const res = { suite, testName, passed, details, severity };
      window.testResults.push(res);
      if (passed) {
        console.log(`[PASS] [${suite}] ${testName}: ${details}`);
      } else {
        console.error(`[FAIL] [${severity}] [${suite}] ${testName}: ${details}`);
      }
    }

    async function runQASuite() {
      console.log('--- STARTING QA TEST SUITE ---');

      // ==========================================
      // SUITE 1: DATABASE & DATA STORE INITIALIZATION
      // ==========================================
      try {
        store.clearDatabase();
        recordTest('Store', 'Clear Database sets empty arrays', 
          store.data.products.length === 0 && store.data.purchases.length === 0 && store.data.sales.length === 0,
          `Products: ${store.data.products.length}, Purchases: ${store.data.purchases.length}, Sales: ${store.data.sales.length}`
        );

        store.loadSampleData();
        recordTest('Store', 'Restore Sample Data loads demo items',
          store.data.products.length > 0 && store.data.sales.length > 0,
          `Loaded ${store.data.products.length} products, ${store.data.sales.length} sales`
        );

        store.clearDatabase();
      } catch (err) {
        recordTest('Store', 'Store init exception', false, err.message, 'Blocker');
      }

      // ==========================================
      // SUITE 2: INVENTORY & PRODUCT MANAGEMENT CRUD
      // ==========================================
      try {
        // C1: Create Product via saveProductDefinition
        const prodDef = store.saveProductDefinition({
          productName: 'QA Test Hoodie',
          category: 'Hoodies',
          brand: 'UrbanWear',
          purchasePrice: 500,
          sellingPrice: 1200,
          sizes: 'M, L, XL',
          description: 'High quality fleece hoodie'
        });

        const createdProd = store.data.products.find(p => p.name === 'QA Test Hoodie');
        recordTest('Product-CRUD', 'Create Product via definition',
          !!createdProd && createdProd.variants.length === 3 && createdProd.totalStock === 0,
          `Variants: ${createdProd ? createdProd.variants.length : 0}, Stock: ${createdProd ? createdProd.totalStock : 'null'}`
        );

        // C2: Create Product with empty/invalid sizes defaults safely
        const prodDef2 = store.saveProductDefinition({
          productName: 'QA Unsized Cap',
          category: 'Accessories',
          brand: 'ClassicFit',
          purchasePrice: 150,
          sellingPrice: 350,
          sizes: ''
        });
        const createdProd2 = store.data.products.find(p => p.name === 'QA Unsized Cap');
        recordTest('Product-CRUD', 'Create Product with empty sizes defaults to Standard',
          !!createdProd2 && createdProd2.variants.length === 1 && createdProd2.variants[0].size === 'Standard',
          `Variants: ${createdProd2 ? createdProd2.variants.map(v => v.size).join(',') : 'none'}`
        );

        // R1: Read Product and Stock Status
        const statusInfo = getProductStockStatus(createdProd, 5);
        recordTest('Product-CRUD', 'Read Product stock status when stock is 0',
          statusInfo.status === 'OUT_OF_STOCK',
          `Status: ${statusInfo.status}`
        );

        // U1: Update Product Details (Name, Category, Brand, Selling Price)
        store.updateProduct(createdProd.id, {
          name: 'QA Test Hoodie V2',
          category: 'Hoodies',
          brand: 'UrbanWear',
          sellingPrice: 1350,
          description: 'Updated fleece hoodie'
        });
        const updatedProd = store.data.products.find(p => p.id === createdProd.id);
        recordTest('Product-CRUD', 'Update Product details updates in memory and storage',
          updatedProd && updatedProd.name === 'QA Test Hoodie V2' && updatedProd.sellingPrice === 1350,
          `Name: ${updatedProd ? updatedProd.name : 'null'}, Price: ${updatedProd ? updatedProd.sellingPrice : 'null'}`
        );

        // U2: Stock Adjustment - ADD
        store.adjustProductStock({
          productId: updatedProd.id,
          size: 'M',
          adjustmentType: 'ADD',
          quantity: 15,
          reason: 'Initial Audit'
        });
        const varM = updatedProd.variants.find(v => v.size === 'M');
        recordTest('Product-CRUD', 'Stock Adjustment ADD increases variant and total stock',
          varM && varM.stock === 15 && updatedProd.totalStock === 15,
          `Var M: ${varM ? varM.stock : 'null'}, Total: ${updatedProd.totalStock}`
        );

        // U3: Stock Adjustment - REMOVE valid
        store.adjustProductStock({
          productId: updatedProd.id,
          size: 'M',
          adjustmentType: 'REMOVE',
          quantity: 5,
          reason: 'Correction'
        });
        recordTest('Product-CRUD', 'Stock Adjustment REMOVE decreases variant and total stock',
          varM && varM.stock === 10 && updatedProd.totalStock === 10,
          `Var M: ${varM ? varM.stock : 'null'}, Total: ${updatedProd.totalStock}`
        );

        // U4: Stock Adjustment - REMOVE exceeding stock should throw error
        let overRemoveThrew = false;
        try {
          store.adjustProductStock({
            productId: updatedProd.id,
            size: 'M',
            adjustmentType: 'REMOVE',
            quantity: 50,
            reason: 'Excess'
          });
        } catch (e) {
          overRemoveThrew = true;
        }
        recordTest('Product-CRUD', 'Stock Adjustment REMOVE exceeding stock is blocked with error',
          overRemoveThrew && varM.stock === 10,
          `Threw: ${overRemoveThrew}, Stock preserved: ${varM.stock}`
        );

        // U5: Stock Adjustment with Negative or Zero Quantity
        let invalidQtyThrew = false;
        try {
          store.adjustProductStock({
            productId: updatedProd.id,
            size: 'M',
            adjustmentType: 'ADD',
            quantity: -5,
            reason: 'Invalid'
          });
        } catch (e) {
          invalidQtyThrew = true;
        }
        recordTest('Product-CRUD', 'Stock Adjustment with negative quantity rejected',
          invalidQtyThrew,
          `Negative qty threw: ${invalidQtyThrew}`
        );

        // D1: Delete Product
        store.deleteProduct(createdProd2.id);
        const deletedSearch = store.data.products.find(p => p.id === createdProd2.id);
        recordTest('Product-CRUD', 'Delete Product removes product from database',
          !deletedSearch,
          `Found after delete: ${!!deletedSearch}`
        );

        // D2: Delete non-existent product
        let deleteNonExistentThrew = false;
        try {
          store.deleteProduct('NON_EXISTENT_ID');
        } catch (e) {
          deleteNonExistentThrew = true;
        }
        recordTest('Product-CRUD', 'Delete non-existent product throws error',
          deleteNonExistentThrew,
          `Threw: ${deleteNonExistentThrew}`
        );

        // D3: Soft-delete Product with historical transactions preserves stock
        store.data.sales.push({
          id: 'TEST-HIST-SALE-D3',
          items: [{ productId: updatedProd.id, product: updatedProd.name, qty: 1, price: 1350 }]
        });
        store.deleteProduct(updatedProd.id);
        const archivedSearch = store.data.products.find(p => p.id === updatedProd.id);
        let sellingArchivedThrew = false;
        try {
          store.addSale({
            customerName: 'Test Buyer',
            items: [{ productId: updatedProd.id, size: 'M', qty: 1, sellingPrice: 1350 }]
          });
        } catch (e) {
          sellingArchivedThrew = true;
        }
        recordTest('Product-CRUD', 'Soft-delete Product with sales preserves stock and blocks new sales',
          archivedSearch && archivedSearch.status === 'Archived' && archivedSearch.totalStock === 10 && sellingArchivedThrew,
          `Status: ${archivedSearch ? archivedSearch.status : 'null'}, Stock: ${archivedSearch ? archivedSearch.totalStock : 'null'}, Blocked sale: ${sellingArchivedThrew}`
        );
        store.data.sales = store.data.sales.filter(s => s.id !== 'TEST-HIST-SALE-D3');

      } catch (err) {
        recordTest('Product-CRUD', 'Product CRUD Exception', false, err.message, 'Critical');
      }

      // ==========================================
      // SUITE 3: PURCHASES & STOCK IN CRUD
      // ==========================================
      try {
        // C1: Create Purchase Draft
        const purDraft = store.savePurchaseDraft({
          supplier: 'SilkRoute Fabrics',
          date: '2026-10-13',
          notes: 'Test PO 1001',
          items: [
            {
              product: 'QA Silk Shirt',
              category: 'Shirts',
              brand: 'ClassicFit',
              size: '38',
              qty: 25,
              buyingPrice: 400,
              sellingPrice: 900
            },
            {
              product: 'QA Silk Shirt',
              category: 'Shirts',
              brand: 'ClassicFit',
              size: '40',
              qty: 15,
              buyingPrice: 420,
              sellingPrice: 950
            }
          ]
        });

        recordTest('Purchases-CRUD', 'Create Purchase Draft succeeds with status Draft',
          purDraft && purDraft.status === 'Draft' && purDraft.items.length === 2,
          `Status: ${purDraft ? purDraft.status : 'null'}, Items: ${purDraft ? purDraft.items.length : 0}`
        );

        // Sync Check: New product created in Inventory master with 0 stock
        const silkProd = store.data.products.find(p => p.name === 'QA Silk Shirt');
        recordTest('Purchases-CRUD', 'Purchase Draft syncs product to inventory with 0 stock',
          !!silkProd && silkProd.totalStock === 0,
          `Found in inv: ${!!silkProd}, Total stock: ${silkProd ? silkProd.totalStock : 'null'}`
        );

        // R1: Read Purchase
        const purFound = (store.data.purchases || []).find(p => p.id === purDraft.id);
        recordTest('Purchases-CRUD', 'Read Purchase Draft by ID',
          !!purFound && purFound.supplier === 'SilkRoute Fabrics',
          `Supplier: ${purFound ? purFound.supplier : 'null'}`
        );

        // U1: Edit Purchase Draft (Updating quantities/items)
        const updatedPurDraft = store.savePurchaseDraft({
          supplier: 'SilkRoute Fabrics',
          date: '2026-10-13',
          notes: 'Updated PO notes',
          items: [
            {
              product: 'QA Silk Shirt',
              category: 'Shirts',
              brand: 'ClassicFit',
              size: '38',
              qty: 30, // changed from 25 to 30
              buyingPrice: 400,
              sellingPrice: 900
            }
          ]
        }, purDraft.id);

        recordTest('Purchases-CRUD', 'Update existing Purchase Draft updates items and quantity',
          updatedPurDraft && updatedPurDraft.items.length === 1 && updatedPurDraft.items[0].qty === 30,
          `Items: ${updatedPurDraft ? updatedPurDraft.items.length : 0}, Item 0 Qty: ${updatedPurDraft && updatedPurDraft.items[0] ? updatedPurDraft.items[0].qty : 'null'}`
        );

        // U2: Cannot receive stock while purchase is in Draft status
        let receiveDraftThrew = false;
        try {
          store.receivePurchaseStock(purDraft.id, { 0: 10 }, '2026-10-13');
        } catch (e) {
          receiveDraftThrew = true;
        }
        recordTest('Purchases-CRUD', 'Receiving stock on unapproved Draft is blocked',
          receiveDraftThrew,
          `Blocked: ${receiveDraftThrew}`
        );

        // U3: Approve Purchase
        store.approvePurchase(purDraft.id);
        recordTest('Purchases-CRUD', 'Approve Purchase transitions status to Approved',
          purDraft.status === 'Approved',
          `Status: ${purDraft.status}`
        );

        // U4: Receive Purchase Stock - Partial
        store.receivePurchaseStock(purDraft.id, { 0: 10 }, '2026-10-13', 'First batch received');
        recordTest('Purchases-CRUD', 'Partial stock receiving sets status Partially Received',
          purDraft.status === 'Partially Received',
          `Status: ${purDraft.status}`
        );

        const var38 = silkProd.variants.find(v => v.size === '38');
        recordTest('Purchases-CRUD', 'Partial stock intake updates inventory variant stock',
          var38 && var38.stock === 10 && silkProd.totalStock === 10,
          `Var 38 stock: ${var38 ? var38.stock : 'null'}, Total: ${silkProd.totalStock}`
        );

        // U5: Receive Remaining Stock - Complete
        store.receivePurchaseStock(purDraft.id, { 0: 20 }, '2026-10-13', 'Final batch received');
        recordTest('Purchases-CRUD', 'Full stock receiving sets status Received',
          purDraft.status === 'Received',
          `Status: ${purDraft.status}`
        );
        recordTest('Purchases-CRUD', 'Total stock reached ordered quantity (30)',
          silkProd.totalStock === 30 && var38.stock === 30,
          `Stock: ${silkProd.totalStock}`
        );

        // U6: Attempt repeated receive on Completed/Received purchase
        let repeatedReceiveThrew = false;
        try {
          store.receivePurchaseStock(purDraft.id, { 0: 5 }, '2026-10-13');
        } catch (e) {
          repeatedReceiveThrew = true;
        }
        recordTest('Purchases-CRUD', 'Repeated stock intake on completed purchase is blocked',
          repeatedReceiveThrew,
          `Blocked: ${repeatedReceiveThrew}`
        );

        // U7: Negative receive quantity validation
        // Create another approved purchase to test negative receive
        const pur2 = store.savePurchaseDraft({
          supplier: 'Urban Thread Co',
          date: '2026-10-13',
          items: [{ product: 'QA Silk Shirt', category: 'Shirts', brand: 'ClassicFit', size: '38', qty: 10, buyingPrice: 400, sellingPrice: 900 }]
        });
        store.approvePurchase(pur2.id);
        let negativeReceiveThrew = false;
        try {
          store.receivePurchaseStock(pur2.id, { 0: -5 }, '2026-10-13');
        } catch (e) {
          negativeReceiveThrew = true;
        }
        recordTest('Purchases-CRUD', 'Negative receive quantity is blocked with error',
          negativeReceiveThrew,
          `Blocked: ${negativeReceiveThrew}`
        );

      } catch (err) {
        recordTest('Purchases-CRUD', 'Purchases CRUD Exception', false, err.message, 'Critical');
      }

      // ==========================================
      // SUITE 4: SALES CRUD & STOCK VALIDATION
      // ==========================================
      try {
        const silkProd = store.data.products.find(p => p.name === 'QA Silk Shirt');

        // C1: Create Sale with Valid Quantities
        const saleRecord = store.addSale({
          customerName: 'Rahul Verma',
          customerPhone: '+91 98765 11223',
          paymentMethod: 'UPI',
          paymentStatus: 'Paid',
          discount: 100,
          items: [
            {
              productId: silkProd.id,
              productName: silkProd.name,
              brand: silkProd.brand,
              category: silkProd.category,
              size: '38',
              qty: 4,
              sellingPrice: 900,
              buyingPrice: 400
            }
          ]
        });

        recordTest('Sales-CRUD', 'Create Sale records successfully',
          !!saleRecord && (store.data.sales || []).length === 1,
          `Sale ID: ${saleRecord ? saleRecord.id : 'null'}`
        );

        // Verify Calculations
        const expectedSubtotal = 4 * 900; // 3600
        const expectedTotal = 3600 - 100; // 3500
        recordTest('Sales-CRUD', 'Sale subtotal and final total calculations accurate',
          saleRecord.subtotal === expectedSubtotal && saleRecord.totalAmount === expectedTotal,
          `Subtotal: ${saleRecord.subtotal} (exp ${expectedSubtotal}), Total: ${saleRecord.totalAmount} (exp ${expectedTotal})`
        );

        // Verify Inventory Deduction
        const var38 = silkProd.variants.find(v => v.size === '38');
        recordTest('Sales-CRUD', 'Sale completion deducts sold quantity from inventory variant',
          var38.stock === 30 - 4 && silkProd.totalStock === 30 - 4, // 26
          `Variant stock: ${var38.stock}, Total stock: ${silkProd.totalStock}`
        );

        // Customer auto-creation / update check
        const customer = (store.data.customers || []).find(c => c.name === 'Rahul Verma');
        recordTest('Sales-CRUD', 'Sale creates customer record with order count and spend',
          !!customer && customer.ordersCount === 1 && customer.totalSpend === expectedTotal,
          `Cust: ${customer ? customer.name : 'null'}, Orders: ${customer ? customer.ordersCount : 0}, Spend: ${customer ? customer.totalSpend : 0}`
        );

        // R1: Read Sales
        const foundSale = store.data.sales.find(s => s.id === saleRecord.id);
        recordTest('Sales-CRUD', 'Read Sale by ID',
          !!foundSale && foundSale.customerName === 'Rahul Verma',
          `Customer: ${foundSale ? foundSale.customerName : 'null'}`
        );

        // C2: Second sale for same customer accumulates spend and orders
        store.addSale({
          customerName: 'Rahul Verma',
          customerPhone: '+91 98765 11223',
          paymentMethod: 'Cash',
          paymentStatus: 'Paid',
          discount: 0,
          items: [
            {
              productId: silkProd.id,
              productName: silkProd.name,
              brand: silkProd.brand,
              category: silkProd.category,
              size: '38',
              qty: 2,
              sellingPrice: 900,
              buyingPrice: 400
            }
          ]
        });
        recordTest('Sales-CRUD', 'Subsequent sale for same customer updates order count and total spend',
          customer.ordersCount === 2 && customer.totalSpend === expectedTotal + (2 * 900),
          `Orders: ${customer.ordersCount}, Spend: ${customer.totalSpend}`
        );

        // Edge case: Discount exceeds subtotal should clamp to 0
        const zeroClampSale = store.addSale({
          customerName: 'Walk-in Customer',
          paymentMethod: 'Cash',
          paymentStatus: 'Paid',
          discount: 5000,
          items: [
            {
              productId: silkProd.id,
              size: '38',
              qty: 1,
              sellingPrice: 900,
              buyingPrice: 400
            }
          ]
        });
        recordTest('Sales-CRUD', 'Excessive discount clamps final total to 0 without going negative',
          zeroClampSale.totalAmount === 0,
          `Final Total: ${zeroClampSale.totalAmount}`
        );

      } catch (err) {
        recordTest('Sales-CRUD', 'Sales CRUD Exception', false, err.message, 'Critical');
      }

      // ==========================================
      // SUITE 5: CUSTOMER CRUD
      // ==========================================
      try {
        const cust = store.data.customers.find(c => c.name === 'Rahul Verma');
        recordTest('Customer-CRUD', 'Read Customer from customer master',
          !!cust && cust.phone === '+91 98765 11223',
          `Phone: ${cust ? cust.phone : 'null'}`
        );

        // U1: Update Customer Details
        cust.name = 'Rahul S. Verma';
        cust.phone = '+91 98000 99999';
        store.save();

        const updatedCust = store.data.customers.find(c => c.id === cust.id);
        recordTest('Customer-CRUD', 'Update Customer name and phone',
          updatedCust && updatedCust.name === 'Rahul S. Verma' && updatedCust.phone === '+91 98000 99999',
          `Name: ${updatedCust ? updatedCust.name : 'null'}, Phone: ${updatedCust ? updatedCust.phone : 'null'}`
        );

        // Edge case: Walk-in Customer should not create distinct customer master records
        const walkInCust = store.data.customers.find(c => c.name === 'Walk-in Customer');
        recordTest('Customer-CRUD', 'Walk-in Customer is not saved as registered customer record',
          !walkInCust,
          `Walk-in present: ${!!walkInCust}`
        );

      } catch (err) {
        recordTest('Customer-CRUD', 'Customer CRUD Exception', false, err.message, 'Normal');
      }

      // ==========================================
      // SUITE 6: REPORTS & METRICS RECONCILIATION
      // ==========================================
      try {
        const metrics = store.getMetrics();
        const sales = store.data.sales || [];
        const products = store.data.products || [];

        // Check product count reconciliation
        recordTest('Reports-Reconciliation', 'Metrics totalProducts matches active products count',
          metrics.totalProducts === products.length,
          `Metrics: ${metrics.totalProducts}, Prods: ${products.length}`
        );

        // Check revenue reconciliation
        const calculatedRev = sales.reduce((s, x) => s + (x.totalAmount || 0), 0);
        recordTest('Reports-Reconciliation', 'Metrics totalRevenue matches sum of sales',
          metrics.totalRevenue === calculatedRev,
          `Metrics: ${metrics.totalRevenue}, Calc: ${calculatedRev}`
        );

        // Check total stock reconciliation
        const calculatedStock = products.reduce((s, p) => s + (p.totalStock || 0), 0);
        recordTest('Reports-Reconciliation', 'Metrics totalStock matches sum of all product stocks',
          metrics.totalStock === calculatedStock,
          `Metrics: ${metrics.totalStock}, Calc: ${calculatedStock}`
        );

      } catch (err) {
        recordTest('Reports-Reconciliation', 'Reconciliation Exception', false, err.message, 'Normal');
      }

      // ==========================================
      // SUITE 7: SETTINGS & LOW STOCK THRESHOLD
      // ==========================================
      try {
        const initialThreshold = store.getLowStockThreshold();
        recordTest('Settings', 'Get Low Stock Threshold returns positive integer',
          initialThreshold >= 1,
          `Threshold: ${initialThreshold}`
        );

        // Update threshold to 12
        const res = store.setLowStockThreshold(12);
        recordTest('Settings', 'Update Low Stock Threshold to valid number succeeds',
          res.success && store.getLowStockThreshold() === 12,
          `New threshold: ${store.getLowStockThreshold()}`
        );

        // Update threshold with invalid values (negative, 0, string)
        const resZero = store.setLowStockThreshold(0);
        const resNeg = store.setLowStockThreshold(-5);
        const resNaN = store.setLowStockThreshold('abc');
        recordTest('Settings', 'Update Low Stock Threshold rejects 0, negative, and non-numeric',
          !resZero.success && !resNeg.success && !resNaN.success,
          `Zero: ${resZero.success}, Neg: ${resNeg.success}, NaN: ${resNaN.success}`
        );

        // Restore threshold
        store.setLowStockThreshold(5);

      } catch (err) {
        recordTest('Settings', 'Settings Exception', false, err.message, 'Normal');
      }

      // ==========================================
      // SUITE 8: TARGET SCENARIOS (SECTION 6 AUDIT & VERIFICATION)
      // ==========================================
      try {
        // SCENARIO 1: Creating a product does not accidentally increase stock
        const p1Def = store.saveProductDefinition({
          productName: 'Scenario 1 Shirt',
          category: 'Shirts',
          brand: 'ClassicFit',
          purchasePrice: 300,
          sellingPrice: 750,
          sizes: 'S, M, L'
        });
        const p1Found = store.data.products.find(p => p.name === 'Scenario 1 Shirt');
        recordTest('Section6-Scenarios', 'Scenario 1: Product creation does not accidentally increase stock',
          p1Found && p1Found.totalStock === 0 && p1Found.variants.every(v => v.stock === 0),
          `Total stock: ${p1Found ? p1Found.totalStock : 'null'}`
        );

        // SCENARIO 2: Receiving a purchase increases the correct size-wise quantities exactly once
        const po1 = store.savePurchaseDraft({
          supplier: 'Apex Apparel Ltd',
          items: [
            { product: 'Scenario 1 Shirt', size: 'M', qty: 20, buyingPrice: 300, sellingPrice: 750 },
            { product: 'Scenario 1 Shirt', size: 'L', qty: 15, buyingPrice: 300, sellingPrice: 750 }
          ]
        });
        store.approvePurchase(po1.id);
        store.receivePurchaseStock(po1.id, { 0: 20, 1: 15 }, '2026-10-13');
        const vM = p1Found.variants.find(v => v.size === 'M');
        const vL = p1Found.variants.find(v => v.size === 'L');
        recordTest('Section6-Scenarios', 'Scenario 2: Receiving purchase increases correct size-wise quantities exactly once',
          vM.stock === 20 && vL.stock === 15 && p1Found.totalStock === 35,
          `M: ${vM.stock}, L: ${vL.stock}, Total: ${p1Found.totalStock}`
        );

        // SCENARIO 3: A partial receipt increases stock only by the newly received quantity
        const po2 = store.savePurchaseDraft({
          supplier: 'SilkRoute Fabrics',
          items: [
            { product: 'Scenario 1 Shirt', size: 'S', qty: 30, buyingPrice: 300, sellingPrice: 750 }
          ]
        });
        store.approvePurchase(po2.id);
        const stockBeforePartial = p1Found.totalStock; // 35
        store.receivePurchaseStock(po2.id, { 0: 10 }, '2026-10-13');
        const vS = p1Found.variants.find(v => v.size === 'S');
        recordTest('Section6-Scenarios', 'Scenario 3: Partial receipt increases stock only by newly received quantity',
          vS.stock === 10 && p1Found.totalStock === stockBeforePartial + 10 && po2.status === 'Partially Received',
          `S: ${vS.stock}, Total: ${p1Found.totalStock}, PO status: ${po2.status}`
        );

        // SCENARIO 4: A duplicate receipt submission does not double-count stock
        let dupThrew = false;
        const stockBeforeDup = p1Found.totalStock;
        try {
          store.receivePurchaseStock(po2.id, { 0: 20 }, '2026-10-13'); // complete po2
          store.receivePurchaseStock(po2.id, { 0: 5 }, '2026-10-13'); // should throw because fully received
        } catch (e) {
          dupThrew = true;
        }
        recordTest('Section6-Scenarios', 'Scenario 4: Duplicate receipt submission is blocked and does not double-count',
          dupThrew && p1Found.totalStock === stockBeforeDup + 20,
          `Threw: ${dupThrew}, Stock: ${p1Found.totalStock}`
        );

        // SCENARIO 5: A confirmed sale decreases the correct size-wise stock
        const sale1 = store.addSale({
          customerName: 'Aarav Patel',
          customerPhone: '+91 91234 56789',
          paymentStatus: 'Paid',

          const salesViewBtns = salesPageEl.querySelectorAll('.view-sale-btn');
          if (salesViewBtns.length > 0) {
            salesViewBtns[0].click();
          }
          const salesNavSuccess = navigatedTarget === 'sales' && navigatedParams && navigatedParams.action === 'view';

          // Customers table View action
          navigatedTarget = null; navigatedParams = null;
          const custPageEl = renderCustomers({}, mockNavigate);
          const custViewBtns = custPageEl.querySelectorAll('.view-cust-btn');
          if (custViewBtns.length > 0) {
            custViewBtns[0].click();
          }
          const custNavSuccess = navigatedTarget === 'customers' && navigatedParams && navigatedParams.action === 'view';

          recordTest('Purchase-Sync-Views', '13.11 Table View action buttons route to dedicated View pages with action: "view"',
            purNavSuccess && salesNavSuccess && custNavSuccess,
            `Pur view nav: ${purNavSuccess}, Sales view nav: ${salesNavSuccess}, Cust view nav: ${custNavSuccess}`
          );

          // 13.12 Cross-Module Navigation: View Page Edit buttons route to respective Edit pages
          purViewEl.querySelector('.edit-pur-page-btn').click();
          const purEditNavSuccess = purNavTgt === 'purchases' && purNavParams && purNavParams.action === 'edit' && purNavParams.purchaseId === testPurPO.id;

          saleViewEl.querySelector('.edit-sale-page-btn').click();
          const saleEditNavSuccess = saleNavTgt === 'sales' && saleNavParams && saleNavParams.action === 'edit' && saleNavParams.saleId === testSaleRecord.id;

          custViewEl.querySelector('.edit-cust-page-btn').click();
          const custEditNavSuccess = custNavTgt === 'customers' && custNavParams && custNavParams.action === 'edit' && custNavParams.customerId === testCustRecord.id;

          recordTest('Purchase-Sync-Views', '13.12 View page Edit buttons navigate directly to respective Edit pages with record IDs',
            purEditNavSuccess && saleEditNavSuccess && custEditNavSuccess,
            `Pur edit nav: ${purEditNavSuccess}, Sale edit nav: ${saleEditNavSuccess}, Cust edit nav: ${custEditNavSuccess}`
          );

          // 13.13 Page router handles action: 'view' across Purchases, Sales, and Customers
          const purRoutedView = renderPurchases({ action: 'view', purchaseId: testPurPO.id });
          const salesRoutedView = renderSales({ action: 'view', saleId: testSaleRecord.id });
          const custRoutedView = renderCustomers({ action: 'view', customerId: testCustRecord.id });

          const purRoutedOk = purRoutedView && purRoutedView.innerHTML.includes(testPurPO.id);
          const salesRoutedOk = salesRoutedView && salesRoutedView.innerHTML.includes(testSaleRecord.id);
          const custRoutedOk = custRoutedView && custRoutedView.innerHTML.includes(testCustRecord.name);

          recordTest('Purchase-Sync-Views', '13.13 Module entry functions render dedicated View pages when params.action === "view"',
            purRoutedOk && salesRoutedOk && custRoutedOk,
            `Pur routed: ${purRoutedOk}, Sales routed: ${salesRoutedOk}, Cust routed: ${custRoutedOk}`
          );

          // 13.14 Authoritative metrics consistency: Inventory and Overview reflect changes accurately
          const overviewEl = renderOverview(() => {});
          const hasOverviewMetrics = overviewEl && !overviewEl.innerHTML.includes('NaN');
          const inventoryEl = renderInventory({}, () => {});
          const hasInventoryMetrics = inventoryEl && !inventoryEl.innerHTML.includes('NaN');

          recordTest('Purchase-Sync-Views', '13.14 Cross-module metrics in Overview and Inventory remain authoritative and mathematically sound',
            hasOverviewMetrics && hasInventoryMetrics,
            `Overview valid: ${hasOverviewMetrics}, Inventory valid: ${hasInventoryMetrics}`
          );

        } catch (s13Err) {
          recordTest('Purchase-Sync-Views', 'Suite 13 Exception', false, s13Err.stack || s13Err.message, 'Blocker');
        }


        // ========================================================
        // SUITE 14: INVENTORY VIEW PAGE & ROW CLICK NAVIGATION REMOVAL
        // ========================================================
        console.log('--- STARTING SUITE 14: INVENTORY VIEW PAGE & ROW CLICKS ---');
        try {
          store.loadSampleData();
          const targetProd = store.data.products[0];

          // 14.1 Dedicated Product View Page renders as full page layout
          let invNavTgt = null, invNavParams = null;
          const mockInvNav = (tgt, p) => { invNavTgt = tgt; invNavParams = p; };
          const prodViewEl = renderViewProductPage({ productId: targetProd.id }, mockInvNav);

          const isNotProdModal = !prodViewEl.classList.contains('modal-overlay');
          const isPageContainer = prodViewEl.classList.contains('page-container');
          const hasProdTitle = prodViewEl.innerHTML.includes(targetProd.name);

          recordTest('Inventory-View-And-RowClicks', '14.1 Dedicated Product View Page renders as full page layout inside page-container',
            isNotProdModal && isPageContainer && hasProdTitle,
            `Not modal: ${isNotProdModal}, Page container: ${isPageContainer}, Has title: ${hasProdTitle}`
          );

          // 14.2 Handles missing product ID gracefully
          const missingProdEl = renderViewProductPage({ productId: 'NON-EXISTENT-PROD-ID' }, mockInvNav);
          const hasMissingError = missingProdEl && missingProdEl.innerHTML.includes('Product Not Found');
          const hasBackToInvBtn = missingProdEl && !!missingProdEl.querySelector('.back-to-list-btn');

          recordTest('Inventory-View-And-RowClicks', '14.2 Missing product ID displays graceful error card with Return to Inventory button',
            hasMissingError && hasBackToInvBtn,
            `Missing error: ${hasMissingError}, Return button: ${hasBackToInvBtn}`
          );

          // 14.3 Displays product name, category, brand, and status badges
          const hasCategory = prodViewEl.innerHTML.includes(targetProd.category || 'General');
          const hasBrand = prodViewEl.innerHTML.includes(targetProd.brand || 'Unbranded');
          const hasStockBadge = prodViewEl.innerHTML.includes('In Stock') || prodViewEl.innerHTML.includes('Stock');

          recordTest('Inventory-View-And-RowClicks', '14.3 Product View Page displays core catalog attributes (name, category, brand, status)',
            hasCategory && hasBrand && hasStockBadge,
            `Category: ${hasCategory}, Brand: ${hasBrand}, Status badge: ${hasStockBadge}`
          );

          // 14.4 Displays KPI cards (Available Stock, Selling Price, Unit Cost, Valuation, Status)
          const kpiGridEl = prodViewEl.querySelector('.kpi-grid');
          const hasStockKpi = kpiGridEl && kpiGridEl.innerHTML.includes('Available Stock');
          const hasSellingKpi = kpiGridEl && kpiGridEl.innerHTML.includes('Selling Price');
          const hasCostKpi = kpiGridEl && kpiGridEl.innerHTML.includes('Unit Cost');
          const hasValuationKpi = kpiGridEl && kpiGridEl.innerHTML.includes('Inventory Valuation');

          recordTest('Inventory-View-And-RowClicks', '14.4 Product View Page displays financial and physical stock KPI cards',
            hasStockKpi && hasSellingKpi && hasCostKpi && hasValuationKpi,
            `Stock: ${hasStockKpi}, Selling: ${hasSellingKpi}, Cost: ${hasCostKpi}, Valuation: ${hasValuationKpi}`
          );

          // 14.5 Displays Size-Wise Inventory & Stock Breakdown table
          const sizeTable = prodViewEl.querySelector('.admin-table');
          const hasSizeHeader = prodViewEl.innerHTML.includes('Size / Variant') || prodViewEl.innerHTML.includes('Size-Wise Inventory');
          const hasVariantSkus = (targetProd.variants || []).every(v => !v.sku || prodViewEl.innerHTML.includes(v.sku));

          recordTest('Inventory-View-And-RowClicks', '14.5 Product View Page displays size-wise variants table with SKUs and stock quantities',
            !!sizeTable && hasSizeHeader && hasVariantSkus,
            `Table exists: ${!!sizeTable}, Header: ${hasSizeHeader}, SKUs present: ${hasVariantSkus}`
          );

          // 14.6 Displays Stock Movement & Ledger History
          const hasMovementSection = prodViewEl.textContent.includes('Stock Movement & Ledger History') || prodViewEl.innerHTML.includes('Stock Movement');

          recordTest('Inventory-View-And-RowClicks', '14.6 Product View Page includes stock movement and ledger history audit log',
            hasMovementSection,
            `Movement section: ${hasMovementSection}`
          );

          // 14.7 Displays Related Purchase Orders and Sales Orders
          const hasTxSection = prodViewEl.textContent.includes('Related Purchase Orders & Sales Transactions') || prodViewEl.innerHTML.includes('Related Purchase Orders');

          recordTest('Inventory-View-And-RowClicks', '14.7 Product View Page cross-references related purchase orders and sales transactions',
            hasTxSection,
            `Cross-references section: ${hasTxSection}`
          );

          // 14.8 Handles Archived products gracefully (warning banner and omits edit action)
          const archivedProd = {
            id: 'PROD-ARCHIVED-TEST',
            name: 'Archived Vintage Joggers',
            category: 'Bottoms',
            brand: 'UrbanFit',
            status: 'Archived',
            purchasePrice: 400,
            sellingPrice: 800,
            stock: 25,
            variants: [{ size: 'M', stock: 25, purchasePrice: 400, sellingPrice: 800 }]
          };
          store.data.products.push(archivedProd);

          const archivedViewEl = renderViewProductPage({ productId: archivedProd.id }, mockInvNav);
          const hasArchivedBanner = archivedViewEl && archivedViewEl.innerHTML.includes('Archived Product:');
          const hasNoEditBtnOnArchived = archivedViewEl && !archivedViewEl.querySelector('.edit-inv-page-btn');

          recordTest('Inventory-View-And-RowClicks', '14.8 Archived products display prominent archive banner and omit edit action',
            hasArchivedBanner && hasNoEditBtnOnArchived,
            `Archive banner: ${hasArchivedBanner}, Edit button omitted: ${hasNoEditBtnOnArchived}`
          );

          // Clean up test archived product
          store.data.products = store.data.products.filter(p => p.id !== archivedProd.id);

          // 14.9 Edit Product button on active products routes to manage-product
          invNavTgt = null; invNavParams = null;
          const editBtn = prodViewEl.querySelector('.edit-inv-page-btn');
          if (editBtn) editBtn.click();
          const editNavOk = invNavTgt === 'inventory' && invNavParams && invNavParams.action === 'manage-product' && invNavParams.id === targetProd.id;

          recordTest('Inventory-View-And-RowClicks', '14.9 Edit Product button navigates to existing product edit workflow',
            editNavOk,
            `Nav target: ${invNavTgt}, Params: ${JSON.stringify(invNavParams)}`
          );

          // 14.10 Back button returns to inventory listing
          invNavTgt = null; invNavParams = null;
          prodViewEl.querySelector('.back-to-list-btn').click();
          const backNavOk = invNavTgt === 'inventory';

          recordTest('Inventory-View-And-RowClicks', '14.10 Back button navigates back to inventory listing page',
            backNavOk,
            `Nav target: ${invNavTgt}`
          );

          // 14.11 Inventory Table: Row click disabled, Name click disabled, View button routes to view page
          let tableNavTgt = null, tableNavParams = null;
          const mockTableNav = (tgt, p) => { tableNavTgt = tgt; tableNavParams = p; };

          const invPageEl = renderInventory({}, mockTableNav);
          const firstInvRow = invPageEl.querySelector('#inventory-table-body tr');

          // Simulate clicking row background
          tableNavTgt = null; tableNavParams = null;
          firstInvRow.click();
          const invRowClickDidNothing = (tableNavTgt === null);

          // Simulate clicking product name cell
          const prodNameCell = firstInvRow.querySelector('td:nth-child(2)');
          tableNavTgt = null; tableNavParams = null;
          if (prodNameCell) prodNameCell.click();
          const invNameClickDidNothing = (tableNavTgt === null);

          // Simulate clicking View button
          const invViewBtn = firstInvRow.querySelector('.view-inv-btn');
          tableNavTgt = null; tableNavParams = null;
          if (invViewBtn) invViewBtn.click();
          const invViewBtnNavigated = (tableNavTgt === 'inventory' && tableNavParams && tableNavParams.action === 'view');

          recordTest('Inventory-View-And-RowClicks', '14.11 Inventory Table: row background and name clicks do nothing; View button navigates to View page',
            invRowClickDidNothing && invNameClickDidNothing && invViewBtnNavigated,
            `Row click no-op: ${invRowClickDidNothing}, Name click no-op: ${invNameClickDidNothing}, View btn nav: ${invViewBtnNavigated}`
          );

          // 14.12 Purchases Table: Row click disabled, Supplier click disabled, View button routes to view page
          const purPageEl = renderPurchases({}, mockTableNav);
          const firstPurRow = purPageEl.querySelector('#pur-table-tbody tr');

          tableNavTgt = null; tableNavParams = null;
          firstPurRow.click();
          const purRowClickDidNothing = (tableNavTgt === null);

          const purSupplierCell = firstPurRow.querySelector('td:nth-child(2)');
          tableNavTgt = null; tableNavParams = null;
          if (purSupplierCell) purSupplierCell.click();
          const purSupplierClickDidNothing = (tableNavTgt === null);

          const purViewBtn = firstPurRow.querySelector('.action-view-btn');
          tableNavTgt = null; tableNavParams = null;
          if (purViewBtn) purViewBtn.click();
          const purViewBtnNavigated = (tableNavTgt === 'purchases' && tableNavParams && tableNavParams.action === 'view');

          recordTest('Inventory-View-And-RowClicks', '14.12 Purchases Table: row background and supplier clicks do nothing; View button navigates to View page',
            purRowClickDidNothing && purSupplierClickDidNothing && purViewBtnNavigated,
            `Row click no-op: ${purRowClickDidNothing}, Supplier click no-op: ${purSupplierClickDidNothing}, View btn nav: ${purViewBtnNavigated}`
          );

          // 14.13 Sales Table: Row click disabled, Customer click disabled, View button routes to view page
          const salesPageEl = renderSales({}, mockTableNav);
          const firstSaleRow = salesPageEl.querySelector('#sales-table-tbody tr');

          tableNavTgt = null; tableNavParams = null;
          firstSaleRow.click();
          const saleRowClickDidNothing = (tableNavTgt === null);

          const saleCustomerCell = firstSaleRow.querySelector('td:nth-child(3)');
          tableNavTgt = null; tableNavParams = null;
          if (saleCustomerCell) saleCustomerCell.click();
          const saleCustomerClickDidNothing = (tableNavTgt === null);

          const saleViewBtn = firstSaleRow.querySelector('.view-sale-btn');
          tableNavTgt = null; tableNavParams = null;
          if (saleViewBtn) saleViewBtn.click();
          const saleViewBtnNavigated = (tableNavTgt === 'sales' && tableNavParams && tableNavParams.action === 'view');

          recordTest('Inventory-View-And-RowClicks', '14.13 Sales Table: row background and customer clicks do nothing; View button navigates to View page',
            saleRowClickDidNothing && saleCustomerClickDidNothing && saleViewBtnNavigated,
            `Row click no-op: ${saleRowClickDidNothing}, Cust click no-op: ${saleCustomerClickDidNothing}, View btn nav: ${saleViewBtnNavigated}`
          );

          // 14.14 Customers Table: Row click disabled, Name click disabled, View button routes to view page
          const custPageEl = renderCustomers({}, mockTableNav);
          const firstCustRow = custPageEl.querySelector('#cust-table-tbody tr');

          tableNavTgt = null; tableNavParams = null;
          firstCustRow.click();
          const custRowClickDidNothing = (tableNavTgt === null);

          const custNameCell = firstCustRow.querySelector('td:nth-child(2)');
          tableNavTgt = null; tableNavParams = null;
          if (custNameCell) custNameCell.click();
          const custNameClickDidNothing = (tableNavTgt === null);

          const custViewBtn = firstCustRow.querySelector('.view-cust-btn');
          tableNavTgt = null; tableNavParams = null;
          if (custViewBtn) custViewBtn.click();
          const custViewBtnNavigated = (tableNavTgt === 'customers' && tableNavParams && tableNavParams.action === 'view');

          recordTest('Inventory-View-And-RowClicks', '14.14 Customers Table: row background and name clicks do nothing; View button navigates to View page',
            custRowClickDidNothing && custNameClickDidNothing && custViewBtnNavigated,
            `Row click no-op: ${custRowClickDidNothing}, Name click no-op: ${custNameClickDidNothing}, View btn nav: ${custViewBtnNavigated}`
          );

          // 14.15 Router Integration: renderInventory renders View page when params.action === 'view'
          const invRoutedView = renderInventory({ action: 'view', productId: targetProd.id });
          const invRoutedOk = invRoutedView && invRoutedView.innerHTML.includes(targetProd.name) && invRoutedView.classList.contains('product-view-page');

          recordTest('Inventory-View-And-RowClicks', '14.15 renderInventory renders dedicated View page when params.action === "view"',
            invRoutedOk,
            `Inventory routed: ${invRoutedOk}`
          );

        } catch (s14Err) {
          recordTest('Inventory-View-And-RowClicks', 'Suite 14 Exception', false, s14Err.stack || s14Err.message, 'Blocker');
        }

      // Leave clean database
      store.clearDatabase();
      console.log('--- QA TEST SUITE COMPLETED ---');
      window.qaSuiteDone = true;

      const passedCount = window.testResults.filter(r => r.passed).length;
      const failedCount = window.testResults.filter(r => !r.passed).length;
      const appEl = document.getElementById('app');
      if (appEl) {
        appEl.innerHTML = `
          <div id="test-summary" data-passed="${passedCount}" data-failed="${failedCount}" data-total="${window.testResults.length}">
            <h2>QA Test Suite: ${passedCount} Passed, ${failedCount} Failed (Total ${window.testResults.length})</h2>
            <ul>
              ${window.testResults.map(r => `<li style="color: ${r.passed ? 'green' : 'red'};">[${r.passed ? 'PASS' : 'FAIL'}] [${r.suite}] ${r.testName}: ${r.details || ''}</li>`).join('\n')}
            </ul>
          </div>
        `;
      }
    }

    window.addEventListener('DOMContentLoaded', runQASuite);
  </script>
</body>
</html>
